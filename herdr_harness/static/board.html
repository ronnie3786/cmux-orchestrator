<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="agenttrail, pointed at the Buzz ticket pipeline — a live map of work items riding the eight stages."
    />
    <title>Herdr Buzz Trail</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23181818'/%3E%3Crect x='6' y='8' width='20' height='4' rx='2' fill='%23e9a23b'/%3E%3Crect x='6' y='14' width='14' height='4' rx='2' fill='%23d1d1d1'/%3E%3Crect x='6' y='20' width='17' height='4' rx='2' fill='%239b9b9b'/%3E%3C/svg%3E"
    />
      <script>
      try {
        document.documentElement.dataset.theme =
          window.webkit?.messageHandlers?.herdrBoard
            ? "dark"
            : localStorage.getItem("herdr-trail-theme") === "light"
              ? "light"
              : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #000;
        --surface: #181818;
        --raised: #1f1f1f;
        --hover: #272727;
        --line: #313131;
        --text: #fff;
        --soft: #d1d1d1;
        --dim: #9b9b9b;
        --faint: #686868;
        --accent: #e9a23b;
        --accent-bg: #2e220f;
        --danger: #db6b67;
        --success: #7aa36a;
        --complete-text: #70a784;
        --complete-bg: rgba(63, 127, 87, 0.18);
        --complete-weight: 500;
        --done-agent-opacity: 0.45;
        --working-border: #1d2b22;
        --working-bg: #141f18;
        --watch-ring: #172015;
        --region: rgba(24, 24, 24, 0.5);
        --minimap-bg: rgba(24, 24, 24, 0.92);
        --overlay: #181818;
        --grid: #313131;
        --shadow-soft: rgba(0, 0, 0, 0.24);
        --shadow-strong: #000;
        --gate-pink: #e08bb8;
        --font: "Geist", "Manrope", -apple-system, system-ui, sans-serif;
        --mono: "Geist Mono", "SF Mono", ui-monospace, monospace;
        --ease: cubic-bezier(0.32, 0.72, 0, 1);
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #fff;
        --surface: rgb(0 0 0 / 0.025);
        --raised: rgb(0 0 0 / 0.05);
        --hover: rgb(0 0 0 / 0.07);
        --line: rgb(0 0 0 / 0.14);
        --text: #000;
        --soft: rgb(0 0 0 / 0.78);
        --dim: #666;
        --faint: rgb(0 0 0 / 0.48);
        --accent: color-mix(in srgb, #e9a23b 64%, #000);
        --accent-bg: rgb(233 162 59 / 0.16);
        --danger: #c4524e;
        --success: #3f7f57;
        --complete-text: #3f7f57;
        --complete-bg: rgb(63 127 87 / 0.18);
        --complete-weight: 600;
        --done-agent-opacity: 0.72;
        --working-border: rgb(63 127 87 / 0.24);
        --working-bg: rgb(63 127 87 / 0.1);
        --watch-ring: rgb(63 127 87 / 0.14);
        --region: rgb(0 0 0 / 0.015);
        --minimap-bg: rgb(255 255 255 / 0.94);
        --overlay: #fbfaf8;
        --grid: rgb(0 0 0 / 0.16);
        --shadow-soft: rgb(0 0 0 / 0.1);
        --shadow-strong: rgb(0 0 0 / 0.14);
        --gate-pink: #b3568c;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html {
        background: var(--bg);
        scroll-behavior: smooth;
      }
      body {
        min-width: 320px;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font: 400 14px/20px var(--font);
        letter-spacing: -0.01em;
        overflow-x: hidden;
      }
      body:before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.025;
        z-index: 4;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
      }
      button {
        font: inherit;
      }
      button,
      [role="button"] {
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      [role="button"]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .skip {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 5;
        transform: translateY(-160%);
        padding: 8px 12px;
        color: var(--text);
        background: var(--raised);
        border-radius: 8px;
        transition: transform 700ms var(--ease);
      }
      .skip:focus {
        transform: none;
      }
      .app {
        display: grid;
        grid-template-rows: minmax(0, 1fr);
        height: 100dvh;
        min-height: 100dvh;
      }
      #state,
      .theme-toggle {
        display: flex;
        align-items: center;
      }
      .sidebar-status {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 38px;
        padding: 6px 12px 6px 16px;
        border-bottom: 1px solid var(--hover);
      }
      .sidebar-status #state { min-width: 0; flex: 1; }
      .sidebar-status .badge { padding: 3px 6px; font-size: 11px; }
      .sidebar-status .badge.ask-toggle { min-width: 28px; padding: 3px 6px; }
      .badge.offline { border-color: rgba(219, 107, 103, .35); color: var(--danger); background: rgba(219, 107, 103, .1); }
      .badge.offline .dot { background: var(--danger); }
      #state {
        gap: 8px;
      }
      .theme-toggle {
        gap: 8px;
        min-height: 32px;
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--dim);
        cursor: pointer;
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
        transition:
          color 250ms var(--ease-out),
          background 250ms var(--ease-out),
          border-color 250ms var(--ease-out),
          transform 250ms var(--ease-out);
      }
      .theme-toggle:hover {
        color: var(--text);
        background: var(--hover);
      }
      .theme-toggle:active {
        transform: scale(0.98);
      }
      .theme-track {
        position: relative;
        width: 32px;
        height: 16px;
        border-radius: 8px;
        background: var(--hover);
        box-shadow: inset 0 0 0 1px var(--line);
        transition: background 250ms var(--ease-out);
      }
      .theme-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 4px;
        background: var(--dim);
        transition:
          transform 250ms var(--ease-out),
          background 250ms var(--ease-out);
      }
      :root[data-theme="light"] .theme-track {
        background: var(--accent-bg);
      }
      :root[data-theme="light"] .theme-thumb {
        transform: translateX(16px);
        background: var(--accent);
      }
      .badge {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--dim);
        white-space: nowrap;
        font-size: 12px;
        line-height: 16px;
      }
      .badge.working {
        border-color: var(--working-border);
        color: var(--success);
        background: var(--working-bg);
      }
      .badge.working .dot {
        background: var(--success);
        animation: working-pulse 1.6s ease-in-out infinite;
      }
      .badge.alert {
        border-color: rgba(219, 107, 103, 0.35);
        color: var(--danger);
        background: rgba(219, 107, 103, 0.1);
        cursor: pointer;
        font-weight: 500;
        transition: background 250ms var(--ease-out);
      }
      .badge.alert:hover {
        background: rgba(219, 107, 103, 0.18);
      }
      .badge.alert:active {
        transform: scale(0.98);
      }
      .badge.alert .dot {
        background: var(--danger);
      }
      :root[data-theme="light"] .badge.alert {
        border-color: rgb(196 82 78 / 0.34);
        background: rgb(196 82 78 / 0.08);
      }
      :root[data-theme="light"] .badge.alert:hover {
        background: rgb(196 82 78 / 0.14);
      }
      @keyframes working-pulse {
        50% {
          opacity: 0.35;
        }
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--faint);
      }
      .workspace {
        position: relative;
        display: grid;
        grid-template-columns: 272px minmax(0, 1fr);
        min-height: 0;
        height: auto;
        overflow: hidden;
      }
      .sidebar {
        min-width: 0;
        min-height: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
        padding: 12px 0 0;
        background: var(--surface);
        border-right: 1px solid var(--hover);
      }
      .tree-head {
        padding: 4px 16px 10px;
        color: var(--faint);
        font-size: 11px;
        line-height: 16px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .tree-row {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        min-height: 24px;
        padding-right: 12px;
        border: 0;
        background: transparent;
        color: var(--soft);
        cursor: pointer;
        text-align: left;
        font-size: 12.5px;
        line-height: 16px;
        white-space: nowrap;
        transition:
          background 250ms var(--ease-out),
          color 250ms var(--ease-out);
      }
      .tree-row.file {
        color: var(--dim);
        cursor: default;
      }
      .tree-row.dir:hover {
        background: var(--hover);
        color: var(--text);
      }
      .tree-chev {
        display: grid;
        flex: none;
        place-items: center;
        width: 14px;
        height: 14px;
        color: var(--faint);
      }
      .tree-chev svg {
        width: 12px;
        height: 12px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 250ms var(--ease-out);
      }
      .tree-row.dir.open .tree-chev svg {
        transform: rotate(90deg);
      }
      .tree-name {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tree-row.hot .tree-name {
        color: var(--accent);
      }
      .tree-ago {
        margin-left: auto;
        color: var(--accent);
        font: 400 10px/16px var(--mono);
        font-variant-numeric: tabular-nums;
      }
      :root[data-theme="light"] .tree-row.hot {
        background: var(--accent-bg);
        box-shadow: inset 2px 0 #e9a23b;
      }
      :root[data-theme="light"] .tree-row.hot .tree-name,
      :root[data-theme="light"] .tree-row.hot .tree-ago {
        font-weight: 600;
      }
      /* Ticket selector rows (the tree is a filter now, not a file browser) */
      .tree-row.ticket {
        padding-left: 16px;
        color: var(--dim);
      }
      .tree-row.ticket:hover {
        background: var(--hover);
        color: var(--text);
      }
      .tree-row.ticket.on {
        background: var(--hover);
        color: var(--text);
        box-shadow: inset 2px 0 var(--accent);
      }
      .tree-row.ticket .tree-name {
        font: 500 11.5px/24px var(--mono);
        letter-spacing: 0.02em;
      }
      .tree-row.ticket.overview .tree-name {
        font: 500 12.5px/24px var(--font);
        letter-spacing: 0;
      }
      .sel-swatch {
        flex: none;
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }
      .sel-swatch.overview {
        width: 7px;
        height: 7px;
        border: 2px solid var(--faint);
        background: transparent;
      }
      .sel-swatch.forming {
        border: 1.5px dashed var(--faint);
        background: transparent;
      }
      .sel-state {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: 5px;
        margin-left: auto;
        color: var(--faint);
        font: 500 9.5px var(--mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .sel-state.gate {
        color: var(--danger);
      }
      .tree-row.ticket .tree-ago {
        margin-left: auto;
      }
      .tree-row.ticket .tree-ago + .sel-state {
        margin-left: 8px;
      }
      .tree-row.ticket.done {
        opacity: 0.55;
      }
      .tree-legend {
        position: sticky;
        bottom: 0;
        margin-top: auto;
        padding: 8px 16px;
        background: var(--surface);
        border-top: 1px solid var(--hover);
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--accent);
        opacity: 0.72;
        font-size: 11px;
        line-height: 15px;
      }
      .tree-legend .theme-toggle {
        margin-left: auto;
        min-width: 28px;
        min-height: 26px;
        justify-content: center;
        padding: 3px 6px;
      }
      .tree-legend .theme-track { display: none; }
      .tree-legend .theme-toggle-label { font-size: 14px; line-height: 16px; }
      .tree-legend-dot {
        flex: none;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        z-index: 9;
        transform: translate(-50%, 8px);
        max-width: 520px;
        padding: 8px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--raised);
        color: var(--soft);
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 700ms var(--ease),
          transform 700ms var(--ease);
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .minimap {
        position: absolute;
        right: 24px;
        bottom: 24px;
        z-index: 2;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--minimap-bg);
        box-shadow: 0 12px 40px var(--shadow-strong);
        cursor: pointer;
      }
      .minimap svg {
        display: block;
      }
      .mm-node {
        fill: var(--faint);
      }
      .mm-node.active {
        fill: var(--accent);
      }
      .mm-node.blocked {
        fill: var(--danger);
      }
      .mm-node.done {
        fill: #3f7f57;
      }
      .mm-view {
        fill: none;
        stroke: var(--soft);
        stroke-width: 1.2;
        opacity: 0.8;
      }
      /* Ticket flow — the only lines on the board: each ticket's traveled
         path in the old edge language (card-edge ports, bowed béziers that
         route around the cards), marching in its direction of travel.
         Finished tickets settle into a static bead-chain ghost. */
      .trailflow {
        opacity: 0.9;
      }
      .trailflow.ended {
        opacity: 0.28;
      }
      .trail-path {
        fill: none;
        stroke: currentColor;
        stroke-width: 2.5;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }
      /* Only the hop still in transition marches; completed hops are solid */
      .trail-path.live {
        stroke-dasharray: 5 8;
        animation: travel 1800ms linear infinite;
      }
      .runs {
        position: absolute;
        right: 24px;
        top: 24px;
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 340px;
        max-width: 44vw;
      }
      .run-card {
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--overlay);
        box-shadow: 0 12px 40px var(--shadow-strong);
        cursor: pointer;
        animation: reveal 500ms var(--ease) both;
      }
      .run-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .run-agent {
        display: inline-flex;
        flex: none;
        width: 16px;
        height: 16px;
      }
      .run-agent svg {
        width: 16px;
        height: 16px;
        display: block;
      }
      .run-name {
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
      }
      .run-sub {
        overflow: hidden;
        color: var(--faint);
        font-size: 11.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .run-elapsed {
        margin-left: auto;
        color: var(--faint);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .run-elapsed a {
        color: var(--accent);
        text-decoration: none;
      }
      .run-live-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--success);
        animation: working-pulse 1.6s ease-in-out infinite;
        flex: none;
      }
      .run-card.ended .run-live-dot {
        background: var(--faint);
        animation: none;
      }
      .run-card.ended {
        opacity: 0.62;
      }
      .run-task {
        margin-top: 6px;
        color: var(--text);
        font-size: 12.5px;
        line-height: 17px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .run-task.idle {
        color: var(--dim);
      }
      .run-tool {
        display: flex;
        gap: 8px;
        align-items: baseline;
        margin-top: 5px;
        color: var(--dim);
        font: 400 11.5px/16px var(--mono);
        overflow: hidden;
        white-space: nowrap;
      }
      .run-tool .tn {
        color: var(--accent);
        flex: none;
      }
      .run-tool .td {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .run-tool .ta {
        margin-left: auto;
        color: var(--faint);
        flex: none;
        font-variant-numeric: tabular-nums;
      }
      .run-detail {
        margin-top: 8px;
        border-top: 1px solid var(--hover);
        padding-top: 8px;
        display: none;
      }
      .run-card.open .run-detail {
        display: block;
      }
      .run-todo {
        display: flex;
        gap: 8px;
        align-items: center;
        min-height: 20px;
        color: var(--dim);
        font-size: 12px;
      }
      .run-todo.in_progress {
        color: var(--text);
      }
      .run-todo.completed {
        color: var(--faint);
        text-decoration: line-through;
      }
      .run-todo .box {
        width: 10px;
        height: 10px;
      }
      .run-hist {
        margin-top: 6px;
        color: var(--faint);
        font: 400 11px/16px var(--mono);
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .run-hist .hd {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .box {
        position: relative;
        z-index: 1;
        width: 12px;
        height: 12px;
        border: 1px solid var(--faint);
        border-radius: 50%;
        background: var(--surface);
        flex: none;
      }
      .box.done {
        border-color: var(--soft);
        background: var(--soft);
      }
      .box.active {
        border-color: var(--accent);
        background: var(--surface);
      }
      .box.active:after {
        content: "";
        position: absolute;
        inset: 2px;
        border-radius: 50%;
        background: var(--accent);
        animation: breathe 1800ms var(--ease-out) infinite alternate;
      }
      @keyframes breathe {
        from {
          opacity: 0.4;
          transform: scale(0.65);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(16px);
          filter: blur(4px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
      }
      .primary {
        min-width: 0;
        min-height: 0;
        overflow: auto;
      }
      .graph-view {
        position: relative;
        overflow: hidden;
        background: var(--bg);
        touch-action: none;
      }
      .graph-grid {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0.35;
      }
      .graph-stage {
        position: absolute;
        inset: 0;
        cursor: grab;
      }
      .graph-stage.dragging {
        cursor: grabbing;
      }
      .graph-svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .world {
        transform-origin: 0 0;
      }
      @keyframes travel {
        to {
          stroke-dashoffset: -26;
        }
      }
      .region-name {
        fill: var(--faint);
        font: 600 15px var(--mono);
        letter-spacing: 0.08em;
      }
      .plate-name {
        fill: var(--text);
        font: 650 44px var(--font);
        letter-spacing: -1px;
      }
      .plate-sub {
        fill: var(--faint);
        font: 400 16px var(--font);
      }
      .gnode {
        cursor: pointer;
      }
      .gnode .node-box {
        fill: var(--surface);
        stroke: var(--line);
        stroke-width: 1;
        transition:
          fill 700ms var(--ease),
          stroke 700ms var(--ease);
      }
      .gnode:hover .node-box {
        fill: var(--raised);
        stroke: var(--faint);
      }
      .gnode.selected .node-box,
      .gnode.active .node-box {
        stroke: var(--accent);
        stroke-width: 1.5;
      }
      /* A stage every selected ticket has cleared reads as passed ground */
      .gnode.done .node-box {
        fill: rgba(63, 127, 87, 0.09);
        stroke: rgba(63, 127, 87, 0.38);
      }
      .gnode.blocked .node-box {
        stroke: var(--danger);
        stroke-width: 1.5;
      }
      .node-spin {
        animation: capsule-spin 1100ms linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .obs-ring,
      .obs-label {
        opacity: 0;
        transition: opacity 400ms var(--ease-out);
      }
      .gnode.obs-live .obs-ring {
        opacity: 1;
        animation: capsule-spin 1300ms linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .gnode.obs-live .obs-label {
        opacity: 1;
      }
      :root[data-theme="light"] .gnode.obs-live .node-box {
        fill: var(--accent-bg);
        stroke: var(--accent);
        stroke-width: 2;
      }
      :root[data-theme="light"] .gnode.obs-live .obs-label {
        font-weight: 700;
      }
      :root[data-theme="light"] .gnode.active {
        filter: drop-shadow(0 8px 12px var(--accent-bg));
      }
      :root[data-theme="light"] .gnode.active .node-box {
        fill: var(--accent-bg);
        stroke: var(--accent);
        stroke-width: 2;
      }
      .gnode .kicker {
        fill: var(--faint);
        font: 500 11px var(--mono);
        letter-spacing: 0.04em;
      }
      .gnode .node-title {
        fill: var(--text);
        font: 600 15px var(--font);
      }
      .gnode .node-meta {
        fill: var(--dim);
        font: 400 12px var(--font);
        font-variant-numeric: tabular-nums;
      }
      .gnode .progress-bg {
        fill: var(--hover);
      }
      .gnode .progress {
        fill: var(--soft);
      }
      .gnode.active .progress {
        fill: var(--accent);
      }
      .gnode .node-action {
        fill: var(--faint);
        font: 500 11px var(--mono);
        letter-spacing: 0.04em;
      }
      .gnode:hover .node-action,
      .gnode.selected .node-action {
        fill: var(--accent);
      }
      .gate-tag {
        fill: var(--gate-pink);
        font: 700 10px var(--mono);
        letter-spacing: 0.06em;
      }
      .obs-file-label {
        fill: var(--accent);
        font: 400 11px var(--mono);
      }
      .obs-verb {
        fill: var(--accent);
        font: 600 11px var(--font);
      }
      .detail-tether {
        fill: none;
        stroke: var(--faint);
        stroke-width: 1;
        stroke-dasharray: 3 4;
        vector-effect: non-scaling-stroke;
      }
      .graph-task-card {
        width: 100%;
        height: 100%;
      }
      .graph-task-card .task-capsules {
        width: 100%;
        margin: 0;
      }
      /* HTML overlay world — mirrors the SVG world transform. Safari does not
         reliably paint foreignObject inside a transformed <g>, so capsule
         lists and intake cards render here instead. */
      .html-world {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        overflow: visible;
        transform-origin: 0 0;
        pointer-events: none;
      }
      .html-world .html-card {
        position: absolute;
        pointer-events: auto;
      }
      .html-world .graph-task-card {
        width: auto;
        height: auto;
      }
      .html-world .intake-card {
        height: auto;
      }
      .task-capsules {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .task-capsules.list {
        gap: 0;
        overflow: hidden;
        border-radius: 16px;
        background: var(--surface);
        box-shadow: 0 2px 12px var(--shadow-soft);
      }
      .task-capsule {
        align-self: stretch;
        overflow: hidden;
        border-radius: 22px;
        background: var(--surface);
        box-shadow: 0 2px 12px var(--shadow-soft);
        animation: capsule-enter 450ms var(--ease-out) both;
        transition:
          border-radius 250ms var(--ease-out),
          background-color 250ms var(--ease-out);
      }
      .task-capsules.list .task-capsule,
      .task-capsules.list .task-capsule.open {
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }
      .task-capsules.list .task-capsule:last-child {
        border-bottom: 0;
      }
      @media (hover: hover) and (pointer: fine) {
        .task-capsule:hover {
          background: var(--hover);
        }
      }
      .task-capsule-button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 44px;
        padding: 0 8px;
        border: 0;
        background: transparent;
        color: var(--text);
        text-align: left;
        cursor: pointer;
      }
      .task-capsule-button:active {
        transform: translateY(1px);
      }
      .task-capsule-marker-wrap {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
      }
      .task-capsule-marker {
        position: relative;
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        color: var(--text);
        font-size: 10px;
        line-height: 16px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .task-capsule-marker svg {
        position: absolute;
        inset: 0;
        display: block;
        width: 24px;
        height: 24px;
        fill: none;
      }
      .task-capsule-marker .ring-track {
        stroke: var(--line);
        stroke-width: 2;
      }
      .task-capsule-marker .ring-live {
        visibility: hidden;
        stroke: var(--accent);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 19.35 49.76;
        animation: capsule-spin 1100ms linear infinite;
      }
      .task-capsule.active .task-capsule-marker .ring-live {
        visibility: visible;
      }
      .task-capsule-badge {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        color: #fff;
        background: #3f7f57;
        animation: capsule-pop 300ms var(--ease-out) both;
        font-size: 12px;
        font-weight: 700;
      }
      .task-capsule-badge svg {
        width: 13px;
        height: 13px;
        fill: none;
        stroke: currentColor;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .task-capsule-badge.blocked {
        background: var(--danger);
      }
      .task-capsule-copy {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
      }
      .task-capsule.active .task-capsule-copy {
        color: var(--text);
      }
      .task-capsule.done .task-capsule-copy {
        color: var(--dim);
      }
      .task-capsule-amount {
        flex: none;
        color: var(--dim);
        font-size: 12px;
        line-height: 16px;
        font-variant-numeric: tabular-nums;
      }
      .task-capsule-pill {
        display: inline-flex;
        flex: none;
        align-items: center;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        color: var(--complete-text);
        background: var(--complete-bg);
        font-size: 11px;
        line-height: 16px;
        font-weight: var(--complete-weight);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .task-capsule-pill.revised {
        color: var(--accent);
        background: var(--accent-bg);
      }
      .task-capsule-pill.blocked {
        color: #e79490;
        background: rgba(219, 107, 103, 0.16);
      }
      :root[data-theme="light"] .task-capsule-pill.blocked {
        color: #a83c38;
        background: rgb(196 82 78 / 0.14);
        font-weight: 600;
      }
      .task-capsule-pill.backlog {
        color: var(--faint);
        background: var(--hover);
      }
      .agent-chip {
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
      }
      .agent-chip svg {
        display: block;
        width: 16px;
        height: 16px;
      }
      .agent-chip.faded {
        opacity: var(--done-agent-opacity);
      }
      .task-capsule-chevron {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        margin-left: -8px;
        border-radius: 50%;
        color: var(--faint);
      }
      .task-capsule-chevron svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 250ms var(--ease-out);
      }
      .task-capsule.open .task-capsule-chevron svg {
        transform: rotate(180deg);
      }
      .task-capsule-detail {
        display: grid;
        grid-template-rows: 0fr;
        opacity: 0;
        transition:
          grid-template-rows 250ms var(--ease-out),
          opacity 200ms var(--ease-out);
      }
      .task-capsule.open .task-capsule-detail {
        grid-template-rows: 1fr;
        opacity: 1;
      }
      .task-capsule-detail-clip {
        overflow: hidden;
      }
      .task-capsule-detail-grid {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        gap: 8px;
        margin-bottom: 12px;
        padding: 0 8px;
      }
      .task-capsule-detail-line {
        width: 1px;
        height: 100%;
        margin: auto;
        background: var(--line);
      }
      .task-capsule-detail-list {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 4px;
      }
      .task-capsule-detail-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 20px;
        color: var(--dim);
        font-size: 12px;
        line-height: 16px;
        animation: capsule-detail-enter 300ms var(--ease-out) both;
      }
      .task-capsule-detail-row > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .task-capsule-detail-meta {
        overflow: hidden;
        color: var(--faint);
        font: 400 11px/16px var(--mono);
        font-variant-numeric: tabular-nums;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: none;
      }
      .cap-link {
        color: var(--accent);
        cursor: pointer;
        white-space: nowrap;
        font-weight: 500;
        flex: none;
      }
      .cap-link:hover {
        text-decoration: underline;
      }
      .cap-approved {
        color: var(--complete-text);
        font-weight: var(--complete-weight);
      }
      @keyframes capsule-enter {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes capsule-detail-enter {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes capsule-pop {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes capsule-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .canvas-tools {
        position: absolute;
        left: 24px;
        bottom: 60px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--overlay);
        box-shadow: 0 12px 40px var(--shadow-strong);
      }
      .icon {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--dim);
        cursor: pointer;
        transition:
          color 700ms var(--ease),
          background 700ms var(--ease),
          transform 700ms var(--ease);
      }
      .icon:hover {
        color: var(--text);
        background: var(--hover);
      }
      .icon:active {
        transform: scale(0.96);
      }
      .icon svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .zoom {
        min-width: 48px;
        color: var(--dim);
        text-align: center;
        font: 500 12px var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .divider {
        width: 1px;
        height: 20px;
        margin: 0 4px;
        background: var(--line);
      }
      .canvas-hint {
        position: absolute;
        left: 24px;
        bottom: 24px;
        display: flex;
        gap: 16px;
        color: var(--faint);
        font-size: 12px;
        pointer-events: none;
      }
      .hint {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .key {
        display: grid;
        place-items: center;
        min-width: 20px;
        height: 20px;
        padding: 0 4px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--surface);
        color: var(--dim);
        font: 500 11px var(--mono);
      }
      .graph-task-empty {
        display: grid;
        place-items: center;
        min-height: 64px;
        padding: 16px;
        border-radius: 16px;
        background: var(--surface);
        color: var(--dim);
        font-size: 12.5px;
      }
      /* ---- v2: topbar ask toggle ---- */
      .badge.ask-toggle {
        min-width: 32px;
        justify-content: center;
        padding: 4px 8px;
        color: var(--dim);
        font-size: 14px;
        line-height: 16px;
        cursor: pointer;
        transition:
          color 250ms var(--ease-out),
          background 250ms var(--ease-out);
      }
      .badge.ask-toggle:hover {
        color: var(--text);
        background: var(--hover);
      }
      /* ---- v2: sidebar sections (agents roster + jira candidates) ---- */
      .tree-head.sect {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--hover);
      }
      .tree-row.done {
        opacity: 0.45;
      }
      .tree-row.logrow {
        cursor: pointer;
      }
      .tree-row.logrow:hover {
        background: var(--hover);
        color: var(--text);
      }
      .tree-row.agent,
      .tree-row.cand,
      .tree-row.action {
        padding-left: 16px;
        min-height: 26px;
        gap: 8px;
      }
      .tree-row.agent:hover,
      .tree-row.cand:hover,
      .tree-row.action:hover {
        background: var(--hover);
        color: var(--text);
      }
      .tree-row.action {
        color: var(--faint);
        font: 500 11px var(--mono);
        letter-spacing: 0.04em;
      }
      .tree-row.action:hover {
        color: var(--accent);
      }
      .agent-status {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-left: auto;
      }
      .status-word {
        color: var(--faint);
        font: 400 10px/16px var(--mono);
      }
      .status-dot {
        position: relative;
        flex: none;
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .status-dot.working {
        background: var(--success);
        animation: working-pulse 1.6s ease-in-out infinite;
      }
      .status-dot.idle {
        background: var(--faint);
      }
      .status-dot.queued {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--dim);
      }
      .status-dot.waiting {
        background: var(--accent);
      }
      .status-dot.offline {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--faint);
        opacity: 0.7;
      }
      .status-dot.offline:after {
        content: "";
        position: absolute;
        left: -2px;
        right: -2px;
        top: 50%;
        height: 1px;
        background: var(--faint);
        transform: rotate(-45deg);
      }
      .cand-act {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
        color: var(--faint);
        font: 500 11px var(--mono);
        letter-spacing: 0.04em;
      }
      .tree-row.cand:hover .cand-act {
        color: var(--accent);
      }
      .cand-act.busy {
        color: var(--accent);
      }
      .cand-spin {
        width: 12px;
        height: 12px;
        animation: capsule-spin 1100ms linear infinite;
      }
      /* ---- v2: machine chip, thread new-dot, handoff + channel rows ---- */
      .mach-chip {
        display: inline-flex;
        flex: none;
        align-items: center;
        height: 16px;
        padding: 0 5px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--faint);
        font: 500 9.5px var(--mono);
        letter-spacing: 0.02em;
      }
      .new-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-left: 6px;
        border-radius: 50%;
        background: var(--accent);
        vertical-align: 1px;
        animation: working-pulse 1.6s ease-in-out infinite;
      }
      .handoff-cmd {
        overflow: hidden;
        color: var(--faint);
        font: 400 11px/16px var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .copy-btn {
        display: grid;
        flex: none;
        place-items: center;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--faint);
        cursor: pointer;
        transition:
          color 250ms var(--ease-out),
          background 250ms var(--ease-out);
      }
      .copy-btn:hover {
        color: var(--text);
        background: var(--hover);
      }
      .copy-btn svg {
        width: 12px;
        height: 12px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .handoff-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--hover);
      }
      .chan-name {
        color: var(--dim);
        font: 400 11px/16px var(--mono);
      }
      .unscoped {
        color: var(--faint);
      }
      .task-capsule.lifecycle-done {
        opacity: 0.55;
      }
      .task-capsule.lifecycle-done .task-capsule-copy {
        color: var(--faint);
      }
      /* ---- v2: INTAKE mini-cards (quieter than gnodes) ---- */
      .intake-card {
        display: flex;
        flex-direction: column;
        gap: 5px;
        height: 100%;
        padding: 14px 16px;
        border: 1px solid var(--hover);
        border-radius: 12px;
        background: var(--raised);
        animation: capsule-enter 450ms var(--ease-out) both;
      }
      .intake-kicker {
        color: var(--faint);
        font: 500 11px var(--mono);
        letter-spacing: 0.04em;
      }
      .intake-title {
        overflow: hidden;
        font-weight: 600;
        font-size: 13.5px;
        line-height: 18px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .intake-chan {
        color: var(--faint);
        font: 400 11px/15px var(--mono);
      }
      .intake-note {
        display: -webkit-box;
        overflow: hidden;
        color: var(--dim);
        font-size: 12px;
        line-height: 16px;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .intake-action {
        align-self: flex-start;
        margin-top: auto;
        padding: 2px 0;
        border: 0;
        background: transparent;
        color: var(--faint);
        cursor: pointer;
        font: 500 11px var(--mono);
        letter-spacing: 0.04em;
        transition: color 250ms var(--ease-out);
      }
      .intake-action:hover {
        color: var(--accent);
      }
      /* ---- DONE region: merged tickets + cleanup actions ---- */
      .done-card {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 14px 16px;
        border: 1px solid rgba(63, 127, 87, 0.4);
        border-radius: 12px;
        background: rgba(63, 127, 87, 0.07);
        animation: capsule-enter 450ms var(--ease-out) both;
      }
      .done-card .done-kicker {
        color: var(--complete-text);
      }
      .done-actions {
        display: flex;
        gap: 14px;
        margin-top: auto;
      }
      .done-actions .intake-action {
        margin-top: 0;
      }
      .done-actions .intake-action:first-child {
        color: var(--complete-text);
      }
      .done-actions .intake-action:first-child:hover,
      .intake-action.quiet:hover {
        color: var(--text);
      }
      .region-sub {
        fill: var(--faint);
        font: 500 13px var(--mono);
        letter-spacing: 0.04em;
      }
      /* ---- Review documents (human-gate artifacts) in capsule details ---- */
      .doc-row {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        overflow: hidden;
        white-space: nowrap;
      }
      .doc-ic {
        flex: none;
        width: 12px;
        height: 12px;
        fill: none;
        stroke: var(--dim);
        stroke-width: 1.8;
        stroke-linejoin: round;
      }
      .doc-kind {
        padding: 1px 5px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--faint);
        font: 600 8.5px var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .doc-meta {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: 8px;
      }
      .doc-dec {
        color: var(--faint);
        font: 500 9.5px var(--mono);
        letter-spacing: 0.03em;
      }
      .doc-dec.ok {
        color: var(--complete-text);
      }
      .doc-dec.bad {
        color: var(--danger);
      }
      .doc-dec.wait {

      async function mutateLive(item, path, body, method) {

      // ---------------------------------------------------------------------

      function renderBadge() {

      // ---------------------------------------------------------------------

      function itemHotAt(key) {

          const i = JIRA_CANDIDATES.indexOf(c);

            c.issue_key +
            "-" +

            id: "work_" + c.issue_key.toLowerCase().replace(/-/g, "_"),

            kind: "feature",

      function intakeAct(key) {
        const e = INTAKE.find((x) => x.key === key);
        if (!e) return;
        toast(
          e.setup_state === "board_created"
            ? `Link a Buzz channel for ${e.key} — the channel picker opens in the real build`

      // Simulator ticks patch selector rows in place — no innerHTML swap, so a

      function patchTreeHot(path, at) {

      // ---------------------------------------------------------------------

      const openRuns = new Set();
      // The Pi handoff recipe for a session — pane plus machine when it is

      function sessionHandoff(s) {

      function renderRuns() {
        const cards = [];

            ? LIVE.runStart

        <div class="run-task">${esc(cur ? cur.content : s.title)}</div>
        <div class="run-tool" data-run-tool><span class="tn">${esc(LIVE.tool.name)}</span><span class="td">${esc(LIVE.tool.detail)}</span><span class="ta t-ago" data-at="${LIVE.tool.at}"></span></div>
        <div class="run-detail">${todos}<div style="margin-top:8px" data-hist>${hist}</div>${handoffRow(sessionHandoff(s))}</div>

          } else {
            const acts = (rec.activity || [])
              .slice(-3)
              .reverse()
              .map(
                (a) =>
                  `<div class="run-hist"><span class="hd">${esc(a.message)}</span><span class="t-ago" data-at="${a.at}"></span></div>`,

              .join("");
            cards.push(`<div class="run-card ${open ? "open" : ""}" data-run="${esc(s.id)}" data-run-stage="${esc(stageKey)}">

      $("runs").addEventListener("click", (e) => {

      function updateRunLive() {

                `<div class="run-hist"><span class="hd">${esc(t.name)} · ${esc(t.detail)}</span><span>${t.ms > 1200 ? Math.round(t.ms / 1000) + "s" : t.ms + "ms"}</span></div>`,

            .join("");

      // ---------------------------------------------------------------------

      // ---------------------------------------------------------------------
      const CARD_W = 400,
        CARD_H = 128,

        GAPX = 120,

      const openDetails = new Set(["implement"]);

      const obsFresh = () => Date.now() - LIVE.obs.at < 60000;

      function capIsOpen(key, c) {
        const id = key + ":" + c.item.key;

      function feedRows() {
        return LIVE.feed
          .slice(0, 4)
          .map(
            (f) =>
              `<div class="task-capsule-detail-row" style="animation:none"><span>${esc(f.message)}</span><span class="task-capsule-detail-meta"><span class="t-ago" data-at="${f.at}"></span></span></div>`,

      function threadLabel(th) {

      function capDetail(key, c) {

        const parts = [];

          const latest =
            key === "implement" ? LIVE.feed[0] : (rec.activity || []).slice(-1)[0];
          const nxt = ORDER[ORDER.findIndex((s) => s.stage_key === key) + 1];
          return `${active.map((a) => chipHtml(a.id)).join("")} <b>AGENTIC-575</b> is ${verb} <b>${esc(STAGE[key].title)}</b>${sess ? ` — ${esc(sess.model)} at <span data-tokens="${esc(sess.id)}">${esc(sess.tokens)}</span> on ${esc(machineName(sess.machine_id))} · ${esc(sess.pane_id)}` : ""}.${latest ? ` Latest: ${esc(latest.message)}` : ""}${nxt ? ` Next: ${esc(nxt.title)}.` : ""}`;
        }
        const groups = { idle: [], queued: [], waiting: [], offline: [] };
        for (const aid of Object.keys(AGENTS)) {
          const st = effStatus(aid);
          if (groups[st]) groups[st].push(aid);
        }
        const nm = (a) => `${chipHtml(a)} ${esc(AGENTS[a].display_name)}`;
        const parts = [];
        if (groups.idle.length)
          parts.push(`${groups.idle.map(nm).join(" · ")} — idle now`);
        if (groups.queued.length)
          parts.push(`${groups.queued.map(nm).join(" · ")} — queued for a slot`);
        if (groups.waiting.length)
          parts.push(`${groups.waiting.map(nm).join(" · ")} — waiting on a gate`);
        if (groups.offline.length)
          parts.push(`${groups.offline.map(nm).join(" · ")} — offline`);
        return parts.join("<br>") || "The whole roster is working.";
      }
      function toggleAskPanel(opener) {
        const qs = ASK_QUESTIONS.map(
          (q, i) =>
            `<button class="ask-q" type="button" onclick="askRun('${q.id}')"><span class="key">${i + 1}</span>${esc(q.label)}</button>`,
        ).join("");
        openOverlay(
          "ask",
          `<div class="overlay-card ask-panel" role="dialog" aria-label="Ask the board" tabindex="-1"><div class="ov-head"><svg class="mic" id="ask-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>ask the board</div>${qs}<div class="ask-answer" id="ask-answer" aria-live="polite"></div></div>`,
          opener,
        );
      }
      function askRun(id) {
        const mic = $("ask-mic"),
          out = $("ask-answer");
        if (!out) return;
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        mic?.classList.add("rec");
        out.innerHTML = `<span class="ask-thinking">listening…</span>`;
        clearTimeout(askRun._h);
        askRun._h = setTimeout(
          () => {
            $("ask-mic")?.classList.remove("rec");
            const o = $("ask-answer");
            if (o) o.innerHTML = askAnswer(id);
          },
          reduced ? 0 : 450,
        );
      }

      // ---------------------------------------------------------------------
      // Liveness — declared vs observed, and the 1s time patcher.
      // Structure rebuilds are gated; time only mutates text and classes.
      // ---------------------------------------------------------------------
      let renderedFeedKey = -1;
      function renderObserved() {
        const live = obsFresh() && keyInFilter(LIVE.obs.item);
        // obs2: a short-lived observed flash on a second stage (Kimi review)
        const live2 =
          !!LIVE.obs2 &&
          Date.now() - LIVE.obs2.at < 12000 &&
          keyInFilter(LIVE.obs2.item);
        for (const g of document.querySelectorAll("g.gnode[data-stage]"))
          g.classList.toggle(
            "obs-live",
            (live && g.dataset.stage === LIVE.obs.stage) ||
              (live2 && g.dataset.stage === LIVE.obs2.stage),
          );
        const ft = document.querySelector(
          `[data-obs-file="${LIVE.obs.stage}"]`,
        );
        if (ft)
          ft.textContent = live
            ? `${LIVE.obs.file} · ${ago(LIVE.obs.at)}`
            : "";
        if (LIVE.obs2 && LIVE.obs2.stage !== LIVE.obs.stage) {
          const ft2 = document.querySelector(
            `[data-obs-file="${LIVE.obs2.stage}"]`,
          );
          if (ft2)
            ft2.textContent = live2
              ? `${LIVE.obs2.file} · ${ago(LIVE.obs2.at)}`
              : "";
        }
        if (renderedFeedKey !== LIVE.feedKey) {
          renderedFeedKey = LIVE.feedKey;
          for (const el of document.querySelectorAll("[data-feed-575]"))
            el.innerHTML = feedRows();
        }
      }
      function renderTimes() {
        renderBadge();
        renderObserved();
        for (const el of document.querySelectorAll(".t-ago"))
          el.textContent = ago(+el.dataset.at);
        // Selector amber decays once an item hasn't been touched for a while.
        for (const row of document.querySelectorAll(
          "#tree .tree-row.ticket.hot",
        )) {
          const at = +((row.querySelector(".t-ago") || {}).dataset || {}).at;
          if (!at || Date.now() - at > 90000) row.classList.remove("hot");
        }
      }

      // ---------------------------------------------------------------------
      // Simulator — every ~7s the board visibly moves: new activity line,
      // tool line swap, obs flash, tree hot stamp, Working badge refresh.
      // ---------------------------------------------------------------------
      const SIM_STEPS = [
        { file: "context-dump.md", actor: "ag-deepseek", message: "Streamed diff hunk into context-dump.md", tool: { name: "Edit", detail: "tickets/AGENTIC-575/context-dump.md" } },
        { file: "state.json", actor: "ag-driver", message: "Checkpointed coder state · stage implement", tool: { name: "Write", detail: "tickets/AGENTIC-575/state.json" } },
        { file: "context-dump.md", actor: "ag-deepseek", message: "Scoped tests green · 42 passed on api-gateway", tool: { name: "Bash", detail: "pytest tests/api_gateway -q" } },
        { file: "state.json", actor: "ag-driver", message: "Pinged Architect iOS for a review slot", tool: { name: "Read", detail: "guard/impact_middleware.py" } },
      ];
      const KIMI_STEPS = [
        { file: "PanelController.swift", message: "Traced the retain cycle — closure capture in the panel delegate." },
        { file: "review-notes.md", message: "Wrote the fix note · weak self in the focus handler." },
        { file: "HotkeyMap.swift", message: "Checked the hotkey remap path — clean." },
      ];
      let simI = -1,
        simN = 0,
        extraI = 0,
        kimiI = 0;
      // Every ~3rd tick, ONE bounded extra: Kimi review activity on HUD-441,
      // token bumps on live run cards, or a "new" dot on the implement thread.
      function simExtra() {
        const kind = extraI++ % 3,
          now = Date.now();
        if (kind === 0) {
          const item = itemByKey("HUD-441");
          const rec = item && recOf(item, "architect-code-review");
          if (!rec || rec.state !== "active") return;
          const st = KIMI_STEPS[kimiI++ % KIMI_STEPS.length];
          (rec.activity = rec.activity || []).push({
            t: demoClock(now),
            at: now,
            actor: "ag-kimi",
            message: st.message,
          });
          if (rec.activity.length > 5) rec.activity.shift();
          logAppend({ at: now, actor: "ag-kimi", item: item.key, message: st.message });
          LIVE.obs2 = {
            stage: "architect-code-review",
            item: "HUD-441",
            file: st.file,
            at: now,
          };
          item._updatedAt = now;
        } else if (kind === 1) {
          for (const { session: s } of RUNNING_SESSIONS) {
            if (s.status !== "running" || s._tok == null) continue;
            s._tok += 2 + Math.round(Math.random() * 7);
            s.tokens = fmtTok(s._tok);
            for (const el of document.querySelectorAll(
              `[data-run-tok="${s.id}"],[data-tokens="${s.id}"]`,
            ))
              el.textContent = s.tokens;
          }
        } else {
          const item = itemByKey("AGENTIC-575");
          const rec = item && recOf(item, "implement");
          const th =
            rec && (rec.buzz_threads || []).find((t) => t.status === "active");
          if (!th) return;
          LIVE.threadNew = th.id;
          for (const sp of document.querySelectorAll(
            `[data-thread="${th.id}"]`,
          ))
            if (!sp.querySelector("[data-new-dot]"))
              sp.insertAdjacentHTML(
                "beforeend",
                '<span class="new-dot" data-new-dot title="new activity"></span>',
              );
        }
      }
      function simTick() {
        simI = (simI + 1) % SIM_STEPS.length;
        simN++;
        const st = SIM_STEPS[simI],
          now = Date.now();
        LIVE.activityAt = now;
        LIVE.toolHist.unshift({
          name: LIVE.tool.name,
          detail: LIVE.tool.detail,
          ms: 180 + Math.round(Math.random() * 2600),
        });
        LIVE.toolHist.length = Math.min(LIVE.toolHist.length, 5);
        LIVE.tool = { name: st.tool.name, detail: st.tool.detail, at: now };
        LIVE.obs = { stage: "implement", file: st.file, at: now };
        const hotPath = "tickets/AGENTIC-575/" + st.file;
        LIVE.hot[hotPath] = now;
        LIVE.feed.unshift({ at: now, actor: st.actor, message: st.message });
        LIVE.feed.length = Math.min(LIVE.feed.length, 6);
        LIVE.feedKey++;
        logAppend({ at: now, actor: st.actor, item: "AGENTIC-575", message: st.message });
        patchTreeHot(hotPath, now);
        updateRunLive();
        if (simN % 3 === 0) simExtra();
        renderTimes();
      }

      // ---------------------------------------------------------------------
      // Boot
      // ---------------------------------------------------------------------
      syncTheme();
      renderTree();
      renderRuns();
      renderGraph();
      renderTimes();
      setInterval(renderTimes, 1000);
      if (DEMO) setInterval(simTick, 7000);
      else {
        boardToken = initBoardToken();
        if (boardToken) {
          loadBoard();
          startEvents();
        } else openConnectOverlay();
      }
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && overlay) {
          closeOverlay();
          return;
        }
        if (
          overlay &&
          overlay.name === "ask" &&
          ["1", "2", "3"].includes(e.key)
        ) {
          askRun(ASK_QUESTIONS[+e.key - 1].id);
          return;
        }
        if (e.target.closest?.("input,textarea,[contenteditable]")) return;
        if (
          (e.key === "f" || e.key === "F") &&
          !e.metaKey &&
          !e.ctrlKey &&
          !e.altKey
        )
          fitBoard();
      });
      window.addEventListener("resize", () => {
        renderMinimapViewport();
      });
    </script>

app = "cmux-harness-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.demo"

[env]
  PORT = "9097"

[http_service]
  internal_port = 9097
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/status"
